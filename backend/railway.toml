[build]
builder = "DOCKERFILE"
dockerfilePath = "/backend/Dockerfile"

[deploy]
startCommand = "sh -c \"python manage.py migrate && python manage.py collectstatic --noinput && if [ \\\"$RAILWAY_SERVICE_NAME\\\" = \\\"email-worker\\\" ]; then python manage.py process_email_queue --sleep 5 --batch-size 100 --workers 5; else gunicorn dolphin.wsgi:application -b [::]:8000 -w 3 --access-logfile /dev/null --error-logfile -; fi\""
