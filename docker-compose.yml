services:
  db:
    image: postgres:16-alpine
    env_file: ./backend/db.env
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db]
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn dolphin.wsgi:application -b 0.0.0.0:8000 -w 3 --access-logfile -"

  email_worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db, backend]
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py process_email_queue --sleep 5 --batch-size 25"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "80:80"
    volumes:
      - media:/app/media:ro
      - static:/app/staticfiles:ro
    restart: unless-stopped

  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    depends_on: [backend]
    environment:
      CI: "1"
    command: npm run test:e2e

volumes:
  dbdata:
  media:
  static:
