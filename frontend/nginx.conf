server {
  listen 80;
  server_name _;
  client_max_body_size 50M;
  root /usr/share/nginx/html;
  index index.html;

  resolver [fd12::10] valid=10s ipv6=on;
  set $backend "http://${BACKEND_UPSTREAM}";

  location /api/ {
    proxy_pass $backend/api/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /admin/ {
    proxy_pass $backend/admin/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /sitemap.xml {
    proxy_pass $backend/sitemap.xml;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /robots.txt {
    proxy_pass $backend/robots.txt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /static/ {
    proxy_pass $backend/static/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location /media/ {
    proxy_pass $backend/media/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
